# Fallback si Coolify sigue en Nixpacks. Preferir Build Pack = Dockerfile.
[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npm run build",
  "cp -r public .next/standalone/",
  "mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/",
]

[start]
cmd = "npx prisma migrate deploy && node .next/standalone/server.js"
